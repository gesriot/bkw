name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to update"
        required: true
        default: "v0.9.1f"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Smoke test app
        shell: pwsh
        run: |
          uv sync --python 3.14 --group dev --locked
          uv run --locked python -m bkw_py.userbkw --template CHNO --mix "rdx=100" --output "$env:TEMP\BKWDATA"
          uv run --locked python -m bkw_py.bkw --input "$env:TEMP\BKWDATA" --output "$env:TEMP\bkw.out"
          if (Select-String -Path "$env:TEMP\bkw.out" -Pattern "NaN|Inf|Infinity" -Quiet) { throw "BKW output contains NaN/Inf" }
          uv run --locked python -m bkw_py.userbkw --template CHNO --mix "rdx=100" --set-ioeq 2 --output "$env:TEMP\BKWDATA_ISP"
          uv run --locked python -m bkw_py.ispbkw --input "$env:TEMP\BKWDATA_ISP" --output "$env:TEMP\isp.out"
          if ((Select-String -Path "$env:TEMP\isp.out" -Pattern "THE ISP IS").Count -lt 2) { throw "ISP output is incomplete" }
          $tdfWork = Join-Path $env:TEMP "bkw-tdf-smoke"
          New-Item -ItemType Directory -Force $tdfWork | Out-Null
          Copy-Item bkw_ui/tdf_engine/tdfdata -Destination (Join-Path $tdfWork "tdfdata") -Force
          Push-Location $tdfWork
          try {
            uv run --locked --project $env:GITHUB_WORKSPACE/app python -m bkw_py.tdf
          } finally {
            Pop-Location
          }
          if (-not (Test-Path (Join-Path $tdfWork "tdf.out"))) { throw "TDF output missing" }
          if ((Get-ChildItem (Join-Path $tdfWork "plots") -Filter "*.png").Count -ne 41) { throw "TDF PNG count mismatch" }

      - name: Build Windows EXE
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Mode onefile -Lto no -ArtifactVersion "${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: bkw-windows-exe
          path: app/dist/windows/BKW-*-windows-x64.exe
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: "BKW Windows build."
          files: release-assets/**/*
          overwrite_files: true
          fail_on_unmatched_files: true
