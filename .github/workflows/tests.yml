name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: app pytest
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --python 3.14 --group dev --locked

      - name: Run tests
        env:
          QT_API: pyside6
          QT_QPA_PLATFORM: offscreen
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: >
          uv run --locked pytest
          tests/test_app_icon.py
          tests/test_paths.py
          tests/test_stage6_userbkw_cli.py
          tests/test_stage6_userbkw_complex.py
          tests/test_stage6_userbkw_legacy_cli_noninteractive.py
          tests/test_stage6_userbkw_legacy_p01.py
          tests/test_stage6_userbkw_legacy_p3b.py
          tests/test_stage6_userbkw_legacy_p56.py
          tests/test_stage6_userbkw_menu_exotic.py
          tests/test_stage6_userbkw_mix.py
          tests/test_ui_graphs_resilience.py
